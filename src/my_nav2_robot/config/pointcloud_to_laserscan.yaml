# Project Mid360 PointCloud2 onto a 2D LaserScan for AMCL / SLAM Toolbox / costmaps.
# Implemented in-tree by my_nav2_robot/pointcloud_to_laserscan_node (no apt package).
# Heights are in target_frame (laser_link). Ground is about -0.12 m in that frame;
# keep min_height above the floor so downward Mid360 rays do not become a
# shrinking obstacle ring around the robot.
# Do not accumulate in laser_link: old clouds are in past robot frames and
# smear onto the robot while driving.
pointcloud_to_laserscan:
    ros__parameters:
        target_frame: laser_link
        transform_tolerance: 0.3
        min_height: 0.02
        max_height: 0.40
        angle_min: -3.14159
        angle_max: 3.14159
        angle_increment: 0.0174533
        scan_time: 0.1
        range_min: 0.2
        range_max: 12.0
        use_inf: true
        inf_epsilon: 1.0
        accumulation_duration: 0.0
