# Project Mid360 PointCloud2 onto a 2D LaserScan for AMCL / SLAM Toolbox / costmaps.
# Heights are in target_frame (laser_link). Ground is about -0.19 m in that frame.
# Retune min_height / max_height / range_* on the real robot after mounting Mid360.
pointcloud_to_laserscan:
    ros__parameters:
        target_frame: laser_link
        transform_tolerance: 0.3
        min_height: -0.15
        max_height: 0.40
        angle_min: -3.14159
        angle_max: 3.14159
        angle_increment: 0.0174533
        scan_time: 0.1
        range_min: 0.2
        range_max: 12.0
        use_inf: true
        inf_epsilon: 1.0
