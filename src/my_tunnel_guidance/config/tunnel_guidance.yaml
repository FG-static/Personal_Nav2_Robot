tunnel_guidance:
    ros__parameters:
        use_sim_time: true
        input_cloud_topic: /livox/lidar
        estimation_frame: base_link
        output_frame: odom

        # ROI, all values are in base_link
        min_forward_distance: 0.2
        max_forward_distance: 8.0
        max_backward_distance: 0.5
        max_lateral_distance: 3.0
        min_side_lateral_distance: 1.0
        min_height: -0.5
        max_height: 2.2
        ground_max_z: 0.0
        voxel_leaf_size: 0.05

        # Plane fitting quality gates
        min_ground_points: 100
        min_wall_points: 100
        plane_max_rmse: 0.08
        min_tunnel_width: 2.5
        max_tunnel_width: 5.0
        min_direction_eigen_gap: 0.05

        # Centerline output
        centerline_length: 8.0
        centerline_point_spacing: 0.2
        lookahead_distance: 5.0

        # Event-triggered local ESDF + Dijkstra inspection-goal search
        search_resolution: 0.10
        search_min_x: -0.5
        search_max_x: 8.0
        search_half_width: 3.0
        search_obstacle_min_height: 0.15
        search_obstacle_max_height: 1.30
        search_robot_clearance: 0.30
        search_clearance_weight: 2.0
        search_clearance_decay: 0.50
        # Unknown 区通行代价乘子（>=1）：路径允许穿过未观测区域，
        # 但通过代价按此系数放大，倾向留在已确认的空地
        search_unknown_cost_factor: 1.3
        # Free 掩码形态学闭运算核边长（格，建议奇数；<3 关闭）：
        # 弥合相邻射线之间假性 Unknown 缝隙，避免绕开逐帧漂移的观测空洞
        search_free_close_kernel: 3
        search_minimum_frontier_distance: 3.0
        search_goal_distance: 5.0
        # 用目标前 2m 路径拟合巡检朝向，避免末端单个对角栅格步带歪 yaw
        search_goal_heading_window: 2.0

        # Optional Nav2 auto goal
        enable_auto_goal: true
        auto_goal_frame_id: map
        min_goal_send_interval: 1.0
        # 到达后 capture_enable=true；dwell 结束后等电控 capture_done，再给视觉发 0x01
        auto_goal_dwell_time: 1.0
        # true: 等 MCU capture_done 再进入视觉握手。false: 跳过电控（仿真）
        allow_capture_done: false # 开始实车前务必打开
        # true: MCU 完成后向 /vision_capture_cmd 发 0x01，等 /vision_capture_status 的 0x02
        wait_for_vision: false # 开始实车前务必打开
        vision_capture_cmd_topic: /vision_capture_cmd
        vision_capture_status_topic: /vision_capture_status
        vision_cmd_hz: 20.0
        # dwell 内把原始 Mid360 变换到 map 并累积（不套导航 ROI）；结束后写入 PCD，并增量合并到 map.pcd
        enable_dataset_recording: true
        wait_for_dataset: true
        dataset_output_dir: /tmp/tunnel_inspections
        dataset_voxel_size: 0.03
        # 放行条件：MCU capture_done（若 allow_capture_done）、视觉拍完（若 wait_for_vision）
        # 与 ~/dataset_ready 同时满足。可用 ~/can_depart、~/dataset_ready、~/merged_map 观察

        # Initial calibration and wall model
        init_required_frames: 3
        ground_band: 0.15
        wall_band: 0.25
        wall_model_update_alpha: 0.1
        wall_position_jump_limit: 0.3

        # Exit: occupancy in a forward window, not PCA wall-point counts.
        # Mid360 still sees walls behind the robot at the mouth, so 360° PCA
        # counts never drop. Only columns with x in [min, max] are used.
        # Must first see a two-sided corridor, then both side walls disappear
        # without a closing wall across the front.
        exit_detection_enabled: true
        exit_confirm_frames: 5
        exit_forward_min_x: 2.0
        exit_forward_max_x: 6.0
        exit_wall_inner_y: 1.0
        exit_wall_outer_y: 2.8
        exit_front_half_width: 0.8
        exit_min_side_column_ratio: 0.35
        exit_max_open_column_ratio: 0.18
        # Thin end-wall occupies only a few x-columns in a 4 m window.
        exit_max_front_columns: 2

        # Temporal stability
        filter_new_measurement_weight: 0.2
        valid_frame_count: 3
        result_hold_time: 0.5
